spring.application.name=yow_point

# Database Configuration (R2DBC for WebFlux)
spring.r2dbc.url=r2dbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.r2dbc.username=${DB_USER}
spring.r2dbc.password=${DB_PASSWORD}
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20
spring.r2dbc.pool.validation-query=SELECT 1

# Liquibase Configuration (JDBC)
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.liquibase.user=${DB_USER}
spring.liquibase.password=${DB_PASSWORD}
spring.liquibase.driver-class-name=org.postgresql.Driver

# Redis Configuration
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# Kafka Configuration
# Render does not provide managed Kafka. Configure an external provider (e.g. Upstash, Confluent)
# or deploy Kafka as a private service.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# Notification Service
notification.service.url=${NOTIFICATION_SERVICE_URL:https://notification-service.pynfi.com}
notification.service.token=${NOTIFICATION_SERVICE_TOKEN:74c0df54-990b-406e-be47-bbafc8d15192}

# Account Security
auth.max-failed-attempts=5
auth.lockout-duration-minutes=15

# Logging
logging.level.root=INFO
logging.level.com.poi.yow_point=INFO
