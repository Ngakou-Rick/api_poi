spring.application.name=yow_point


# Configuration R2DBC pour développement local
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/yow_poi
spring.r2dbc.driver=postgresql
spring.r2dbc.username=postgres
spring.r2dbc.password=postgres

# Configuration JDBC pour Liquibase (Liquibase utilise JDBC)
spring.datasource.url=jdbc:postgresql://localhost:5432/yow_poi
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Profil par défaut pour le développement 
#spring.profiles.active=prod

# Reste de votre configuration de développement...
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20
spring.r2dbc.pool.max-idle-time=30m
spring.r2dbc.pool.validation-query=SELECT 1

server.port=8080

logging.level.com.poi.yow_point=DEBUG
logging.level.org.springframework.data.r2dbc=DEBUG
logging.level.io.r2dbc.postgresql=DEBUG

# Désactivation de l'initialisation SQL classique au profit de Liquibase
spring.r2dbc.initialization-mode=never
spring.sql.init.mode=never

# Configuration Liquibase
# Les migrations s'exécutent automatiquement au démarrage de l'application via Spring Boot.
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true

#spring.main.allow-bean-definition-overriding=true
# Pour utiliser uniquement WebFlux (reactive)
spring.main.web-application-type=reactive

# Elasticsearch configuration
spring.elasticsearch.uris=http://localhost:9200

# Redis configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379