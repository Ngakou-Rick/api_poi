spring.application.name=yow_point


# Configuration R2DBC pour développement local (Supabase si vous voulez garder)
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/poi_test
spring.r2dbc.driver=postgresql
spring.r2dbc.username=postgres

# Configuration Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.r2dbc.password=postgres

# Profil par défaut pour le développement 
#spring.profiles.active=prod

# Reste de votre configuration de développement...
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20
spring.r2dbc.pool.max-idle-time=30m
spring.r2dbc.pool.validation-query=SELECT 1

server.port=8080

logging.level.com.poi.yow_point=DEBUG
logging.level.org.springframework.data.r2dbc=DEBUG
logging.level.io.r2dbc.postgresql=DEBUG

spring.r2dbc.initialization-mode=always
# Disable standard SQL init in favor of Liquibase
spring.sql.init.mode=never
spring.sql.init.continue-on-error=false
# spring.sql.init.schema-locations=classpath:schema.sql

# Liquibase Configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true

# JDBC Datasource for Liquibase (Required as R2DBC is used for app)
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.url=jdbc:postgresql://localhost:5432/poi_test
spring.liquibase.user=postgres
spring.liquibase.password=postgres
spring.liquibase.driver-class-name=org.postgresql.Driver


#spring.main.allow-bean-definition-overriding=true
# Pour utiliser uniquement WebFlux (reactive)
spring.main.web-application-type=reactive

# Redis configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

