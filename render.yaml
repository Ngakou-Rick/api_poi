services:
  # Web Service: The API application
  - type: web
    name: api-poi
    envVars:
      - key: SC_LOG_LEVEL
        value: info
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: 8080
      - key: JAVA_OPTS
        value: -Dserver.port=8080 -Xmx512m
      # Database Connection Variables (Supabase)
      - key: DB_HOST
        value: aws-1-eu-west-1.pooler.supabase.com
      - key: DB_PORT
        value: 6543
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres.fekyysmeqrjctqiwyrjo
      - key: DB_PASSWORD
        value: poi_navigoo27
      # Redis Connection Variables
      - key: REDIS_HOST
        fromService:
          type: redis
          name: redis-poi
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: redis-poi
          property: port
      # JWT Secret (You should generate a strong secret for production)
      - key: JWT_SECRET
        generateValue: true
      # Kafka Configuration (Optional: Using Upstash or similar external provider is recommended)
      # If using external Kafka, set these environment variables in the Render Dashboard
      # - KAFKA_BOOTSTRAP_SERVERS
      # - KAFKA_SECURITY_PROTOCOL
      # - KAFKA_SASL_MECHANISM
      # - KAFKA_SASL_JAAS_CONFIG
    runtime: docker
    plan: free

  # Redis Instance
  - type: redis
    name: redis-poi
    plan: free # change to starter/standard for production
    ipAllowList: [] # allow internal access only by default

# No managed databases section needed since we use Supabase (external)
